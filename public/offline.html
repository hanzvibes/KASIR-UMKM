<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d754b" />
    <title>Offline · Kasir UMKM</title>
    <style>body{font:16px system-ui,sans-serif;margin:0;background:#f5f7f5;color:#17231d;min-height:100dvh;padding:24px;box-sizing:border-box}.card{max-width:600px;margin:8vh auto;background:white;border:1px solid #e1e7e2;border-radius:20px;padding:28px;box-shadow:0 12px 30px #17231d0d}h1{margin:0 0 10px;font-size:24px}p{line-height:1.6;color:#647067}button{border:0;background:#1d754b;color:white;border-radius:12px;padding:13px 18px;font-weight:700}.product{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e6e9e6}.product small{display:block;color:#647067;margin-top:4px}</style>
  </head>
  <body><main class="card"><h1>Kamu sedang offline</h1><p>Daftar produk tersimpan hanya untuk dilihat. Checkout dan penyimpanan transaksi perlu koneksi internet.</p><section id="products" aria-live="polite"></section><button onclick="location.reload()">Coba lagi</button></main><script>const root=document.getElementById('products');const business=localStorage.getItem('kasir-umkm:offline-active-business-v1');const saved=business?localStorage.getItem('kasir-umkm:offline-products-v1:'+business):null;try{const products=JSON.parse(saved||'[]');if(products.length){const title=document.createElement('h2');title.textContent='Produk tersimpan';root.append(title);for(const product of products){const row=document.createElement('div');row.className='product';const name=document.createElement('span');name.textContent=product.name;const detail=document.createElement('small');detail.textContent=(product.sku||'')+(product.sku?' · ':'')+product.unit;name.append(detail);const price=document.createElement('strong');price.textContent=new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(product.price)||0);row.append(name,price);root.append(row)}}else{const note=document.createElement('p');note.textContent='Belum ada produk tersimpan di perangkat ini. Buka kasir saat online agar produk tersedia untuk dilihat saat offline.';root.append(note)}}catch{const note=document.createElement('p');note.textContent='Data produk offline tidak dapat dibaca.';root.append(note)}</script></body>
</html>
